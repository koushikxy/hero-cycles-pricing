<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar no-print">
        <a href="/" class="brand">Hero Cycles <small>Sales desk</small></a>
        <nav class="nav"><a href="/">New quote</a><a href="admin.html">Prices</a></nav>
    </header>

    <main class="page doc">
        <div class="doc-actions no-print">
            <a href="/" class="btn-link">Back to new quote</a>
            <button type="button" onclick="window.print()" class="btn btn-primary">Download PDF</button>
        </div>
        <article class="panel" id="quote"><p class="empty-note">Loading quote...</p></article>
    </main>

    <script>
        const rupees = n => "₹" + Math.round(n).toLocaleString("en-IN");
        const niceDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

        async function loadQuote() {
            const box = document.getElementById("quote");
            const id = new URLSearchParams(location.search).get("id");
            const response = await fetch(`/api/quotes/${encodeURIComponent(id)}`);
            if (!response.ok) {
                box.innerHTML = '<p class="empty-note">Quote not found.</p>';
                return;
            }
            const q = await response.json();
            document.title = `Hero Cycles quote #${q.id}`;
            box.innerHTML = `
                <div class="doc-head">
                    <div>
                        <p class="brand">Hero Cycles</p>
                        <h1>Price quote</h1>
                    </div>
                    <dl class="meta">
                        <dt>Quote no.</dt><dd>#${q.id}</dd>
                        <dt>Prices as on</dt><dd>${niceDate(q.quote_date)}</dd>
                        <dt>Created</dt><dd>${new Date(q.created_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}</dd>
                    </dl>
                </div>
                <table>
                    <tr><th>Component</th><th>Part</th><th class="num">Price</th></tr>
                    ${q.items.map(i => `<tr><td>${i.component}</td><td>${i.name}</td><td class="num">${rupees(i.price)}</td></tr>`).join("")}
                </table>
                <div class="total"><span>Total</span><strong>${rupees(q.total)}</strong></div>
                <p class="doc-foot">Prices are for the date shown above and may change after it.</p>`;
        }

        loadQuote();
    </script>
</body>
</html>
