<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Price Estimator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">Hero Cycles <small>Sales desk</small></a>
        <nav class="nav"><a href="/" class="active">New quote</a><a href="admin.html">Prices</a></nav>
        <div class="date-control">
            <label for="quote-date">Price date</label>
            <input type="date" id="quote-date">
            <button type="button" id="today-btn" class="btn">Today</button>
        </div>
    </header>

    <main class="page layout">
        <section>
            <h1 class="page-title">Build the cycle</h1>
            <p class="page-sub">Prices shown are for the price date. Click a selected part again to remove it.</p>
            <div id="builder"><p class="empty-note">Loading parts...</p></div>
        </section>

        <aside class="summary">
            <div class="panel" id="quote-panel">
                <div class="summary-head">
                    <div>
                        <h2>Quote</h2>
                        <p class="summary-date" id="summary-date"></p>
                    </div>
                    <button type="button" id="clear-btn" class="btn-link">Clear all</button>
                </div>
                <div id="error-box" class="alert" role="alert" hidden></div>
                <div class="lines" id="lines"></div>
                <div class="total"><span>Total</span><strong id="grand-total">₹0</strong></div>
                <div class="save-row">
                    <button type="button" id="save-btn" class="btn btn-primary" disabled>Save quote</button>
                    <p id="saved-note" class="saved-note" hidden></p>
                </div>
            </div>

            <div class="panel recent">
                <h3>Recent quotes</h3>
                <div id="recent-quotes"></div>
            </div>
        </aside>
    </main>

    <div class="mobile-bar">
        <div><small>Total</small><strong id="mobile-total">₹0</strong></div>
        <a href="#quote-panel" class="btn btn-primary">View quote</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
